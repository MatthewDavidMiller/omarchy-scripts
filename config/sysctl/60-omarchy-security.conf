# Managed by omarchy-scripts (bin/setup-security-hardening).
#
# Four of the keys below are already at these values on a current Arch kernel,
# set by the kernel's own build config rather than by any file. They are pinned
# here so the machine's posture stops depending on a default that upstream is
# free to change, and so `sysctl` disagreeing with this file is a reportable
# drift rather than an unrecorded choice.
#
# Ownership caveat: /etc/default/ufw sets IPT_SYSCTL=/etc/ufw/sysctl.conf, and
# ufw applies that file on every enable and reload -- after systemd-sysctl has
# run at boot. For the keys ufw also sets, ufw wins. Today the values agree, so
# nothing here is being reverted, but a key ufw claims cannot be governed from
# this file. Those keys are accept_redirects (v4 and v6, all and default),
# rp_filter, accept_source_route, log_martians and icmp_echo_ignore_broadcasts.
# bin/setup-security-hardening reads every key back after applying this file and
# warns on a mismatch.

# Restrict kernel-address disclosure while retaining root debugging access.
# Not 2: that hides pointers from root as well and blinds privileged perf work.
kernel.kptr_restrict = 1

# Keep the kernel ring buffer -- which leaks addresses, hardware detail, and
# occasionally credentials -- away from unprivileged readers.
kernel.dmesg_restrict = 1

# A process may only ptrace its own descendants. This is what stops one
# compromised desktop application from reading another's memory: browser
# session cookies, an unlocked keyring, an ssh-agent's keys.
kernel.yama.ptrace_scope = 1

# No unprivileged access to performance events. The perf subsystem has been a
# recurring source of local privilege escalation, and nothing on a workstation
# needs it without sudo.
kernel.perf_event_paranoid = 2

# No unprivileged BPF program loading at all. 2 rather than 1 because 1 still
# permits it for CAP_BPF holders; the verifier is a large attack surface and
# nothing here loads BPF as an ordinary user. OpenSnitch's eBPF probe is loaded
# by opensnitchd as root and is unaffected.
kernel.unprivileged_bpf_disabled = 2

# Do not autoload TTY line disciplines on demand. The rarely-exercised ones are
# a recurring CVE source and reachable from an unprivileged TIOCSETD; a desktop
# never needs one that is not already resident.
dev.tty.ldisc_autoload = 0

# Remove the boot-another-kernel-from-userspace path. This is one-way until the
# next reboot, and it breaks `systemctl kexec`. It does not affect hibernation:
# resume= uses swsusp, not kexec, so the machine's hibernate setup is untouched.
kernel.kexec_load_disabled = 1

# This workstation is not a router. Do not emit or trust ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Deliberately not set here, so nobody adds one later and wonders why:
#
#   kernel.unprivileged_userns_clone, user.max_user_namespaces
#       Rootless podman is built on user namespaces. Restricting them breaks
#       bin/setup-rootless-podman and the container lint toolchain with it.
#
#   fs.suid_dumpable
#       /usr/lib/sysctl.d/50-coredump.conf sets 2 on purpose so systemd-coredump
#       can capture privileged crashes. The crash-diagnosis workflow depends on
#       it. bin/setup-security-hardening reports the resulting dump store size
#       instead of taking the capability away.
#
#   net.ipv4.conf.all.log_martians
#       Claimed by /etc/ufw/sysctl.conf, which sets it to 0 after this file is
#       applied. Setting it here would be silently reverted on the next ufw
#       reload -- exactly the failure the ownership caveat above describes.
