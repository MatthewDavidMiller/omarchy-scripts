# Managed by omarchy-scripts (bin/setup-rootless-podman).
#
# omarchy-settings ships /etc/systemd/resolved.conf.d/20-docker-dns.conf, which
# binds the stub resolver to docker0's gateway address:
#
#   [Resolve]
#   DNSStubListenerExtra=172.17.0.1
#
# Rootless podman never creates that interface -- containers reach DNS through
# pasta in the user's own network namespace -- so the listener answers on an
# address no interface holds, and systemd-resolved freebinds it anyway. Deleting
# the shipped file does not stick: pacman owns it and restores it on every
# omarchy-settings upgrade. resolved.conf(5): "If an empty string is assigned,
# then all previous assignments are cleared." Drop-ins are read in filename
# order, so this one clears the list after the shipped file has set it.
[Resolve]
DNSStubListenerExtra=
