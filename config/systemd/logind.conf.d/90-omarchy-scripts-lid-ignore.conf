# Managed by omarchy-scripts (bin/setup-no-lid-sleep).
#
# Closing the lid does nothing to the power state: no suspend, no hibernate,
# no poweroff. logind's stock HandleLidSwitch=suspend is the only thing on an
# Omarchy install that acts on the lid for power -- the Hyprland lid binding
# only locks the session and reconfigures displays. Omarchy ships no lid
# setting of its own, so this sets all three explicitly rather than relying on
# HandleLidSwitchExternalPower inheriting HandleLidSwitch.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
